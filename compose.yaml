# Usage: scripts/claude.sh /path/to/project   (sets PROJECT_DIR, AUTH_DIR and the compose project name)
services:
  claude:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: claude-container
    volumes:
      - ${PROJECT_DIR:?run via scripts/claude.sh}:/workspace
      - config:/home/claude/.claude          # per-project: .claude.json, history, tool permissions
      - ${AUTH_DIR:?run via scripts/claude.sh}:/home/claude/.claude-auth  # shared across projects: the login only
    stdin_open: true
    tty: true
    init: true

volumes:
  config:
